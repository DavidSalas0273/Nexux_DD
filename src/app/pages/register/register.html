<div class="reg-page">

  <!-- ══ NAVBAR ══════════════════════════════════════ -->
  <nav class="navbar">
    <a class="nav-brand" routerLink="/login">
      <svg class="nav-logo-svg" viewBox="0 0 210 210" role="img" aria-label="Logo NexusDD">
        <rect class="tile" x="0" y="0" width="210" height="210" rx="58"/>
        <path class="bowl" d="M40 115h130a65 65 0 0 1-130 0z"/>
        <rect class="rim"  x="31" y="97" width="148" height="20" rx="10"/>
        <path class="leaf l1" d="M80 94C70 68 78 46 96 40c12 14 12 36-2 54z"/>
        <path class="leaf l2" d="M104 94c-6-26 4-44 24-48 6 20-4 38-24 48z"/>
      </svg>
      <span class="nav-brand-name">Nexus</span>
    </a>
  </nav>

  <!-- ══ MAIN ════════════════════════════════════════ -->
  <div class="main-wrap">

    <!-- Logo animado grande — izquierda en desktop, arriba en mobile -->
    <div class="logo-side">
      <svg class="big-logo" viewBox="0 0 210 210" role="img" aria-label="Logo NexusDD">
        <rect class="tile" x="0" y="0" width="210" height="210" rx="58"/>
        <path class="bowl" d="M40 115h130a65 65 0 0 1-130 0z"/>
        <rect class="rim"  x="31" y="97" width="148" height="20" rx="10"/>
        <path class="leaf l1" d="M80 94C70 68 78 46 96 40c12 14 12 36-2 54z"/>
        <path class="leaf l2" d="M104 94c-6-26 4-44 24-48 6 20-4 38-24 48z"/>
      </svg>
    </div>

    <!-- Contenido derecho -->
    <div class="content-side">
      <div class="content-inner">


        <!-- Título -->
        <h2 class="main-title">
          Aprende a cocinar<br class="br-md"/>
        </h2>


        <!-- Formulario -->
        @if (error()) {
          <div class="alert-error">{{ error() }}</div>
        }

        <form (ngSubmit)="onSubmit()" class="reg-form">

          <!-- Fila nombre + correo -->
          <div class="form-row">
            <input
              type="text"
              name="nombre"
              placeholder="Nombre completo"
              [ngModel]="nombre()"
              (ngModelChange)="nombre.set($event)"
              required
              autocomplete="name"
              class="reg-input"
            />
            <input
              type="email"
              name="correo"
              placeholder="Correo electrónico"
              [ngModel]="correo()"
              (ngModelChange)="correo.set($event)"
              required
              autocomplete="email"
              class="reg-input"
            />
          </div>

          <!-- Contraseña -->
          <div class="form-row single">
            <input
              type="password"
              name="password"
              placeholder="Contraseña"
              [ngModel]="password()"
              (ngModelChange)="password.set($event)"
              required
              autocomplete="new-password"
              class="reg-input"
            />
          </div>

          <!-- Foto opcional -->
          <div class="photo-row">
            <label class="photo-label">
              <div class="photo-preview">
                @if (fotoPreview()) {
                  <img [src]="fotoPreview()" alt="Foto" class="photo-img"/>
                } @else {
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="22" height="22">
                    <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                  </svg>
                }
              </div>
              <span class="photo-text">Foto de perfil <em>(opcional)</em></span>
              <input type="file" accept="image/*" (change)="onFileSelected($event)" class="photo-file"/>
            </label>
          </div>

          <!-- Acciones -->
          <div class="form-actions">
            <button type="submit" class="btn-register" [disabled]="loading()">
              {{ loading() ? 'CREANDO CUENTA...' : 'CREAR CUENTA GRATIS' }}
            </button>
            <a routerLink="/login" class="link-login">
              Ya tengo cuenta
              <svg fill="currentColor" viewBox="0 0 12 12" width="11" height="11">
                <path d="M9.707,5.293l-5-5A1,1,0,0,0,3.293,1.707L7.586,6,3.293,10.293a1,1,0,1,0,1.414,1.414l5-5A1,1,0,0,0,9.707,5.293Z"/>
              </svg>
            </a>
          </div>

        </form>

      </div>
    </div>

  </div>
</div>
