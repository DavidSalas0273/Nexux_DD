<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Nexus DD</h1>
      <p>Crea tu cuenta nueva</p>
    </div>

    @if (error()) {
      <div class="alert alert-error">{{ error() }}</div>
    }

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <!-- Foto de perfil -->
      <div class="form-group photo-group">
        <label>Foto de perfil (opcional)</label>
        <div class="photo-preview">
          @if (fotoPreview()) {
            <img [src]="fotoPreview()" alt="Preview" class="photo-img" />
          } @else {
            <div class="photo-placeholder">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M12 5v14M5 12h14" stroke-linecap="round" />
              </svg>
            </div>
          }
        </div>
        <input type="file" accept="image/*" (change)="onFileSelected($event)" class="file-input" />
      </div>

      <div class="form-group">
        <label for="nombre">Nombre completo</label>
        <input
          type="text"
          id="nombre"
          name="nombre"
          placeholder="Tu nombre"
          [ngModel]="nombre()"
          (ngModelChange)="nombre.set($event)"
          required
        />
      </div>

      <div class="form-group">
        <label for="correo">Correo electrónico</label>
        <input
          type="email"
          id="correo"
          name="correo"
          placeholder="tu@correo.com"
          [ngModel]="correo()"
          (ngModelChange)="correo.set($event)"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          required
        />
      </div>

      <button type="submit" class="btn-primary" [disabled]="loading()">
        {{ loading() ? 'Cargando...' : 'Registrarme' }}
      </button>
    </form>

    <p class="auth-footer">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión aquí</a>
    </p>
  </div>
</div>
