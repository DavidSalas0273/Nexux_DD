<!-- Iconos de navegación a color, compartidos por la barra lateral y la inferior -->
<ng-template #navIcono let-nombre>
  <svg class="nav-icono" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
    @switch (nombre) {
      @case ('aprender') {
        <svg:path fill="#ffc800" d="M5 12.2L12 6.6l7 5.6V20a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 20z" />
        <svg:rect fill="#e5a400" x="10" y="14.5" width="4" height="7" rx="1" />
        <svg:path fill="#ff4b4b" d="M2.5 11.2L12 3.5l9.5 7.7a1.2 1.2 0 0 1-1.5 1.9L12 6.6 4 13.1a1.2 1.2 0 0 1-1.5-1.9z" />
      }
      @case ('retos') {
        <svg:circle fill="#ff4b4b" cx="12" cy="12" r="10" />
        <svg:circle fill="#fff" cx="12" cy="12" r="6.6" />
        <svg:circle fill="#ff4b4b" cx="12" cy="12" r="3.4" />
      }
      @case ('ranking') {
        <svg:path fill="#ffc800" d="M12 2.5l8 3v6.2c0 4.8-3.3 8.4-8 9.8-4.7-1.4-8-5-8-9.8V5.5z" />
        <svg:path fill="#e5a400" d="M12 2.5l8 3v6.2c0 4.8-3.3 8.4-8 9.8z" />
        <svg:path fill="#fff" d="M12 7.2l1.4 2.9 3.1.4-2.3 2.2.6 3.1L12 14.3l-2.8 1.5.6-3.1-2.3-2.2 3.1-.4z" />
      }
      @case ('perfil') {
        <svg:circle fill="#f1d9ff" cx="12" cy="12" r="10" />
        <svg:circle fill="#ce82ff" cx="12" cy="9.5" r="3.6" />
        <svg:path fill="#ce82ff" d="M5.6 18.6a7.4 7.4 0 0 1 12.8 0A9.9 9.9 0 0 1 12 22a9.9 9.9 0 0 1-6.4-3.4z" />
      }
    }
  </svg>
</ng-template>

<!-- Contadores de racha, gemas y vidas -->
<ng-template #contadores>
  <span class="stat streak" title="Días de racha">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path fill="#ff9600" d="M13.5.7s.7 2.6.7 4.8c0 2-1.3 3.7-3.4 3.7S7.2 7.5 7.2 5.5v-.4C5.2 7.5 4 10.6 4 14a8 8 0 0 0 16 0c0-5.4-2.6-10.2-6.5-13.3z" />
      <path fill="#ffc800" d="M12 21a3.6 3.6 0 0 1-3.6-3.6c0-1.9 1.2-3.3 2.9-4.9.3 1.3 1.2 2 2.2 2 .8 0 1.4-.4 1.8-1 .2.8.3 1.4.3 2.1A3.6 3.6 0 0 1 12 21z" />
    </svg>
    <span>{{ racha }}</span>
  </span>
  <span class="stat gems" title="Gemas">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path fill="#1cb0f6" d="M6.5 3h11l4.5 6-10 12L2 9z" />
      <path fill="#84d8ff" d="M6.5 3h11L12 9z" />
      <path fill="#1899d6" d="M22 9l-10 12 5-12z" />
    </svg>
    <span>{{ gemas }}</span>
  </span>
  <span class="stat lives" title="Vidas">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path fill="#ff4b4b" d="M12 21.4l-1.5-1.3C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.5 11.5z" />
      <path fill="#fff" opacity="0.45" d="M6.2 6.4c.9-.9 2.3-1 3.2-.3-.9.2-1.8.8-2.3 1.7-.4.6-.6 1.3-.6 2-.8-1-.9-2.5-.3-3.4z" />
    </svg>
    <span>{{ vidas }}</span>
  </span>
</ng-template>

<div class="app-shell">

  <!-- ══ BARRA LATERAL (escritorio) ══════════════════ -->
  <nav class="sidebar-nav" aria-label="Navegación principal">
    <a class="sidebar-brand" routerLink="aprender">
      <!-- Logo de Nexus (el mismo de public/Login animado con logo.html) -->
      <svg class="sidebar-brand-icon" viewBox="0 0 210 210" width="44" height="44" aria-hidden="true">
        <rect class="logo-tile" x="0" y="0" width="210" height="210" rx="58" fill="#247c58" />
        <path d="M40 115h130a65 65 0 0 1-130 0z" fill="#fff" />
        <rect x="31" y="97" width="148" height="20" rx="10" fill="#f4b735" />
        <path class="logo-hoja" d="M80 94C70 68 78 46 96 40c12 14 12 36-2 54z" fill="#f4b735" />
        <path class="logo-hoja logo-hoja-2" d="M104 94c-6-26 4-44 24-48 6 20-4 38-24 48z" fill="#fff" />
      </svg>
      <span class="sidebar-brand-text">Nexus</span>
    </a>

    <div class="nav-lista">
      @for (item of navItems; track item.ruta) {
        <a [routerLink]="item.ruta" routerLinkActive="active" class="nav-tab-side">
          <ng-container *ngTemplateOutlet="navIcono; context: { $implicit: item.ruta }" />
          <span>{{ item.etiqueta }}</span>
        </a>
      }
    </div>

    <div class="sidebar-spacer"></div>

    <div class="sidebar-stats">
      <ng-container *ngTemplateOutlet="contadores" />
    </div>

    @if (user(); as u) {
      <div class="sidebar-usuario">
        <span class="avatar">
          @if (fotoUrl()) {
            <img [src]="fotoUrl()" alt="" />
          } @else {
            {{ inicial() }}
          }
        </span>
        <span class="usuario-texto">
          <strong>{{ u.nombre }}</strong>
          <small>{{ u.correo }}</small>
        </span>
        <button class="btn-salir" type="button" title="Cerrar sesión" aria-label="Cerrar sesión" (click)="logout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" width="20" height="20" aria-hidden="true">
            <path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3" />
            <path d="M10 17l-5-5 5-5" />
            <path d="M5 12h11" />
          </svg>
        </button>
      </div>
    }
  </nav>

  <!-- ══ PANEL DERECHO ═══════════════════════════════ -->
  <div class="shell-right">

    <!-- Barra superior (solo móvil) -->
    <header class="top-bar">
      <div class="top-bar-stats">
        <ng-container *ngTemplateOutlet="contadores" />
      </div>
    </header>

    <main class="main-content">
      <router-outlet />
    </main>

    <!-- Barra inferior (solo móvil) -->
    <nav class="bottom-nav" aria-label="Navegación principal">
      @for (item of navItems; track item.ruta) {
        <a [routerLink]="item.ruta" routerLinkActive="active" class="nav-tab" [attr.aria-label]="item.etiqueta">
          <ng-container *ngTemplateOutlet="navIcono; context: { $implicit: item.ruta }" />
          <span>{{ item.etiqueta }}</span>
        </a>
      }
    </nav>
  </div>

</div>
