<div class="login-page">

  <!-- ══ NAVBAR ══════════════════════════════════════ -->
  <nav class="navbar">
    <a class="nav-brand" routerLink="/login">
      <svg class="nav-logo-svg" viewBox="0 0 210 210" role="img" aria-label="Logo NexusDD">
        <rect class="tile" x="0" y="0" width="210" height="210" rx="58"/>
        <path class="bowl" d="M40 115h130a65 65 0 0 1-130 0z"/>
        <rect class="rim"  x="31" y="97" width="148" height="20" rx="10"/>
        <path class="leaf l1" d="M80 94C70 68 78 46 96 40c12 14 12 36-2 54z"/>
        <path class="leaf l2" d="M104 94c-6-26 4-44 24-48 6 20-4 38-24 48z"/>
      </svg>
      <span class="nav-brand-name">Nexus</span>
    </a>
  </nav>

  <!-- ══ HERO ════════════════════════════════════════ -->
  <section class="hero">

    <!-- Logo grande animado -->
    <div class="hero-logo-wrap">
      <svg class="hero-logo-svg" viewBox="0 0 210 210" role="img" aria-label="Logo NexusDD grande">
        <rect class="tile" x="0" y="0" width="210" height="210" rx="58"/>
        <path class="bowl" d="M40 115h130a65 65 0 0 1-130 0z"/>
        <rect class="rim"  x="31" y="97" width="148" height="20" rx="10"/>
        <path class="leaf l1" d="M80 94C70 68 78 46 96 40c12 14 12 36-2 54z"/>
        <path class="leaf l2" d="M104 94c-6-26 4-44 24-48 6 20-4 38-24 48z"/>
      </svg>
    </div>

    <!-- CTA -->
    <div class="hero-cta">
      <h1 class="hero-title">
        ¡La forma más divertida de<br/>aprender a cocinar!
      </h1>

      @if (error()) {
        <div class="alert-error">{{ error() }}</div>
      }

      <form (ngSubmit)="onSubmit()" class="cta-form">
        <div class="field-group">
          <input
            type="email"
            id="correo"
            name="correo"
            placeholder="Correo electrónico"
            [ngModel]="correo()"
            (ngModelChange)="correo.set($event)"
            required
            autocomplete="email"
            class="cta-input"
          />
        </div>
        <div class="field-group">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Contraseña"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            required
            autocomplete="current-password"
            class="cta-input"
          />
        </div>

        <button type="submit" class="btn-empezar" [disabled]="loading()">
          {{ loading() ? 'CARGANDO...' : 'EMPIEZA AHORA' }}
        </button>
      </form>

      <a routerLink="/register" class="btn-tengo-cuenta">
        
        CREAR CUENTA 
      </a>
    </div>

  </section>

  <!-- ══ BARRA DE PLATOS ═════════════════════════════ -->
  <footer class="platos-bar">
    <button class="scroll-arrow left" aria-label="anterior" (click)="scrollPlatos(-1)">&#8249;</button>

    <div class="platos-list" #platosList>

      <div class="plato-item">
        <!-- Salsas madre -->
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" width="28" height="28">
          <path d="M8 24h24a12 12 0 0 1-24 0z" fill="currentColor"/>
          <rect x="6" y="20" width="28" height="4" rx="2" fill="currentColor"/>
          <path d="M16 18c-2-5 0-10 4-11 2 3 2 8-1 11" fill="currentColor" opacity=".7"/>
          <path d="M21 18c-1-5 1-9 5-10 1 4-1 7-5 10" fill="currentColor" opacity=".5"/>
        </svg>
        <span>Salsas</span>
      </div>

      <div class="plato-item">
        <!-- Cortes / cuchillo -->
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" width="28" height="28">
          <path d="M12 30L28 8l2 2-14 22-4-2z" fill="currentColor"/>
          <rect x="11" y="28" width="8" height="4" rx="2" fill="currentColor" opacity=".6"/>
        </svg>
        <span>Cortes</span>
      </div>

      <div class="plato-item">
        <!-- Proteínas / bistec -->
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" width="28" height="28">
          <ellipse cx="20" cy="22" rx="13" ry="8" fill="currentColor"/>
          <path d="M10 18c2-6 18-6 20 0" stroke="currentColor" stroke-width="2" fill="none" opacity=".5"/>
        </svg>
        <span>Proteínas</span>
      </div>

      <div class="plato-item">
        <!-- Repostería / pastel -->
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" width="28" height="28">
          <rect x="8" y="20" width="24" height="12" rx="3" fill="currentColor"/>
          <rect x="12" y="14" width="16" height="8"  rx="3" fill="currentColor" opacity=".7"/>
          <line x1="20" y1="8" x2="20" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="20" cy="7" r="2" fill="currentColor"/>
        </svg>
        <span>Repostería</span>
      </div>

      <div class="plato-item">
        <!-- Fondos / olla -->
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" width="28" height="28">
          <path d="M10 18h20v8a8 8 0 0 1-16 0v-8z" fill="currentColor"/>
          <rect x="8"  y="16" width="24" height="4" rx="2" fill="currentColor" opacity=".6"/>
          <rect x="5"  y="17" width="4"  height="6" rx="2" fill="currentColor" opacity=".5"/>
          <rect x="31" y="17" width="4"  height="6" rx="2" fill="currentColor" opacity=".5"/>
        </svg>
        <span>Fondos</span>
      </div>

      <div class="plato-item">
        <!-- Técnicas / fuego -->
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" width="28" height="28">
          <path d="M20 32c-7 0-10-5-8-11 1-3 3-5 5-6-1 3 1 5 3 4 3-1 5-6 3-10 4 3 7 9 5 15-1 4-4 8-8 8z" fill="currentColor"/>
        </svg>
        <span>Técnicas</span>
      </div>

      <div class="plato-item">
        <!-- Panadería / pan -->
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" width="28" height="28">
          <ellipse cx="20" cy="22" rx="12" ry="8" fill="currentColor"/>
          <ellipse cx="20" cy="18" rx="10" ry="6" fill="currentColor" opacity=".6"/>
          <path d="M14 17 Q20 11 26 17" stroke="currentColor" stroke-width="1.5" fill="none" opacity=".4"/>
        </svg>
        <span>Panadería</span>
      </div>

      <div class="plato-item">
        <!-- Verduras / hoja -->
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" width="28" height="28">
          <path d="M20 32C10 28 8 14 18 8c4 8 2 14-4 18 6-2 12-8 12-16 4 6 4 18-6 22z" fill="currentColor"/>
        </svg>
        <span>Verduras</span>
      </div>

    </div>

    <button class="scroll-arrow right" aria-label="siguiente" (click)="scrollPlatos(1)">&#8250;</button>
  </footer>

</div>
