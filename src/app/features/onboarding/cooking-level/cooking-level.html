<section class="onboarding-wrapper">
  <div class="onboarding-card">

    <div class="onboarding-header">
      <span class="onboarding-step">Paso 1 de 1</span>
      <h1 class="onboarding-title">¿Cuál es tu nivel de cocina?</h1>
      <p class="onboarding-subtitle">
        Hola <strong>{{ user()?.displayName ?? 'chef' }}</strong>, esto nos ayuda a personalizar
        tu ruta de aprendizaje.
      </p>
    </div>

    <div class="levels-grid" role="radiogroup" aria-label="Nivel de cocina">
      @for (level of levels; track level.value) {
        <button
          type="button"
          class="level-card"
          [class.level-card--selected]="isSelected(level.value)"
          (click)="select(level.value)"
          [attr.aria-pressed]="isSelected(level.value)"
          [attr.aria-label]="level.label + ': ' + level.description"
        >
          <span class="level-icon" aria-hidden="true">{{ level.icon }}</span>
          <div class="level-info">
            <span class="level-label">{{ level.label }}</span>
            <span class="level-description">{{ level.description }}</span>
          </div>
          @if (isSelected(level.value)) {
            <span class="level-check" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </span>
          }
        </button>
      }
    </div>

    <!-- Ruta de aprendizaje preview -->
    @if (selected()) {
      <div class="learning-path" role="status" aria-live="polite">
        <span class="learning-path-label">📚 Tu ruta de aprendizaje:</span>
        <p class="learning-path-text">
          {{ levels | levelPath: selected()! }}
        </p>
      </div>
    }

    <button
      type="button"
      class="btn-confirm"
      [disabled]="!selected() || loading()"
      (click)="confirm()"
      aria-live="polite"
    >
      @if (loading()) {
        Guardando…
      } @else {
        Empezar mi ruta de aprendizaje →
      }
    </button>

  </div>
</section>
